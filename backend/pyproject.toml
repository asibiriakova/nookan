[project]
name = "nookan-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asibiriakova", email = "a.g.sibiriakova@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "nanoid>=2.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
nookan-backend = "nookan_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "UP042", # `class Foo(str, Enum)` is deliberate here, for OpenAPI/JSON string values
]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets DATABASE_URL before importing nookan_backend, which reads it at import time.
"tests/conftest.py" = ["E402"]
